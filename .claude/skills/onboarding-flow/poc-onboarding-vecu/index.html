<title>Onboarding vécu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* v6 : reprise des vrais composants de l'app (lus dans le repo le 11/11) :
   DARK_CARD_BG (theme.ts), PointFormeRing + AnswerSheet (anneau en haut, feuille blanche 10 crans),
   DecisionRing fluide (arc 240°, Braise, secteur de zone pointillé, repère PRÉVU, curseur à 3 traits, voix « Gère l'effort »),
   LiveSessionHost (chrono mono 52, carte blanche, jauge de ressenti 5 niveaux en orange de charge, toast pilule),
   PricingPriming (OfferRows, ValuePath Ajuste / Comprends / Anticipe, ancrage), RiskTimeline, INTERVIEWS (photos réelles).
   Motion : courbe .23,1,.32,1 ; pression scale .97 ; cascade 60 ms ; feuilles 420 ms ; rien depuis scale(0). */
:root{
  --ground:#0b0e10; --panel:#141a1e; --line:rgba(255,255,255,.10); --ink:#f3f5f6; --muted:rgba(255,255,255,.64); --faint:rgba(255,255,255,.42);
  --accent:#d44000; --accent-hi:#f04a08; --soft:#ff8a55; --cool:#8cc3d4; --good:#7fdb8f; --gold:#ffc24a;
  --app:#070a0d; --dark-card:radial-gradient(ellipse 105% 65% at 50% -10%,rgba(56,189,248,.32) 0%,rgba(125,211,252,.12) 40%,transparent 65%),radial-gradient(ellipse 55% 35% at 15% 25%,rgba(14,165,233,.1) 0%,transparent 55%),#070a0d;
  --page:#f1f0ee; --tink:#171b1f; --tmuted:#6b7177; --tline:rgba(0,0,0,.10); --seg-off:#ebe9e4;
  --sans:"DM Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1); --drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink);margin:0}
body{font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
button,input,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:44px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}.phone-col{order:-1;justify-self:center;width:100%;max-width:400px}}
.phone-col{position:sticky;top:18px}
@media (max-width:920px){.phone-col{position:static}}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
h1{font-size:30px;line-height:1.12;letter-spacing:-.025em;margin:8px 0 10px;text-wrap:balance}
.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0;max-width:64ch}
.controls{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0 6px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.seg-row{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg-row button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer}
.seg-row button[aria-pressed="true"]{background:#fff;color:#171b1f}
.box{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.84);border:1px solid var(--line);background:var(--panel)}
.box b{color:#fff}
.box .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;color:var(--soft)}
.box ul{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:5px}
.steps .ph-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:10px 0 2px}
.steps li button{width:100%;text-align:left;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);cursor:pointer}
.steps li button[aria-current="step"]{border-color:var(--soft);background:#1c1612}
.steps .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-top:1px}
.steps .t{font-weight:700;font-size:13.5px}
.steps .d{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.new{background:rgba(255,138,85,.16);color:var(--soft)}
.tag.prod{background:rgba(140,195,212,.14);color:var(--cool)}
.tag.todo{background:rgba(255,194,74,.14);color:var(--gold)}

/* ── iPhone ── */
.device{width:100%;max-width:400px;aspect-ratio:400/846;border-radius:56px;padding:9px;background:linear-gradient(145deg,#3a3f44,#15181b 40%,#2a2e32);box-shadow:0 50px 120px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--app);color:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:31%;height:30px;border-radius:20px;background:#000;z-index:60}
.sb{position:absolute;top:0;left:0;right:0;height:50px;padding:16px 28px 0 32px;display:flex;justify-content:space-between;z-index:59;font-weight:700;font-size:15px;pointer-events:none;transition:color .3s}
.sb.dark{color:#111}
.sb svg{height:11px;width:auto;margin-left:5px;vertical-align:-1px}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:36%;height:5px;border-radius:5px;background:rgba(255,255,255,.85);z-index:59;pointer-events:none}
.homebar.dark{background:#111}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:scrIn .42s var(--ease)}
@keyframes scrIn{from{opacity:0;transform:translateX(16px)}}
.scr.back{animation-name:scrBack}
@keyframes scrBack{from{opacity:0;transform:translateX(-16px)}}
.quiet .scr{animation:none}
.bgdark{position:absolute;inset:0;background:var(--dark-card);z-index:0}
.bgpage{position:absolute;inset:0;background:var(--page);z-index:0}
.photo{position:absolute;left:0;right:0;top:0;height:64%;z-index:0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.78)}
.photo::after{content:"";position:absolute;inset:0;background:#c43a00;mix-blend-mode:multiply;opacity:.72}
.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(7,10,13,.55) 0%,rgba(7,10,13,.2) 26%,rgba(7,10,13,.82) 54%,#070a0d 68%)}
.head{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:56px 18px 6px}
.rb{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:transform .16s var(--ease)}
.rb:active{transform:scale(.94)}
.rb.lt{border-color:var(--tline);background:#fff;color:var(--tink)}
.rb[hidden]{visibility:hidden;display:grid}
.frise{flex:1;display:grid;gap:6px}
.frise i{height:4px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.18);display:block}
.frise i b{display:block;height:100%;border-radius:999px;background:var(--accent);transform-origin:left;transition:transform .35s var(--ease)}
.skip{border:0;background:none;color:rgba(255,255,255,.7);font-weight:700;font-size:14px;cursor:pointer}
.body{position:relative;z-index:3;flex:1;min-height:0;overflow-y:auto;padding:6px 20px 12px;display:flex;flex-direction:column;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.foot{position:relative;z-index:4;flex-shrink:0;padding:10px 20px 28px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.h{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.h.big{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.h em{font-style:normal;color:var(--soft)}
.p{font-size:15px;line-height:1.5;color:rgba(255,255,255,.62);margin:0;text-wrap:pretty}
.pill{display:block;width:100%;padding:16px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:16px;cursor:pointer;transition:transform .16s var(--ease),opacity .2s}
.pill:active{transform:scale(.97)}
.pill[disabled]{background:rgba(255,255,255,.12);color:rgba(255,255,255,.4);cursor:default}
.sheet .pill[disabled]{background:#e8e4df;color:#a3a8ad}
.pill.white{background:#fff;color:#111}
.buy{width:100%;height:52px;border-radius:16px;border:0;background:#D44000;color:#fff;font-size:15px;font-weight:900;cursor:pointer;transition:transform .16s var(--ease)}
.buy:active{transform:scale(.97)}
.buy .chev{display:inline-block;margin-left:6px}
.caption{text-align:center;font-size:12px;color:rgba(255,255,255,.55);margin-top:8px}
.caption.lt{color:var(--tmuted)}
[data-s]{opacity:0;transform:translateY(10px);animation:rise .5s var(--ease) forwards;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{to{opacity:1;transform:none}}
.quiet [data-s]{animation:none;opacity:1;transform:none}

/* Feuille blanche du bas (AnswerSheet / feuilles de l'app) */
.sheet{position:relative;z-index:6;flex-shrink:0;background:#fff;color:var(--tink);border-radius:22px 22px 0 0;padding:12px 20px 30px;box-shadow:0 -10px 30px rgba(0,0,0,.35);animation:sheetUp .42s var(--drawer)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.quiet .sheet{animation:none}
.grab{width:36px;height:4px;border-radius:9px;background:rgba(0,0,0,.14);margin:0 auto 10px}
.st{font-size:25px;font-weight:900;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.ss{font-size:15px;line-height:1.4;color:#6b7076;margin-top:4px}
.lab{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8f94}
.word{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.1;min-height:38px}
.word.ph{font-size:17px;font-weight:600;color:#9a9ea3;padding-top:10px}
.segs10{display:flex;gap:4px;height:46px;margin-top:10px;touch-action:none;cursor:pointer}
.segs10 span{flex:1;border-radius:8px;background:var(--seg-off);transition:background .15s,transform .15s}
.ends{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a8f94}
.chipl{padding:11px 15px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--tink);border:1px solid var(--tline);background:#fff;transition:transform .16s var(--ease)}
.chipl:active{transform:scale(.96)}
.chipl[aria-pressed="true"]{color:var(--accent);border:2px solid var(--accent);background:rgba(212,64,0,.06)}
.optc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:16px;cursor:pointer;color:var(--tink);border:1px solid var(--tline);background:#fff;margin-top:10px;font-size:16px;font-weight:800;transition:transform .16s var(--ease)}
.optc:active{transform:scale(.98)}
.optc[aria-pressed="true"]{border:2px solid var(--accent);background:rgba(212,64,0,.06)}
.field{display:grid;gap:5px;font-size:11px;font-weight:700;color:#62686e}
.field input{font-size:16px;height:50px;border-radius:12px;border:1.5px solid #e2e4e6;padding:0 13px;background:#f7f8f9;color:#14181b;width:100%;transition:border-color .2s}
.field input.ok{border-color:#2fbf71}
.sso{width:100%;height:50px;border-radius:14px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .16s var(--ease)}
.sso:active{transform:scale(.98)}
.sso.g{background:#fff;color:#14181b;border:1.5px solid #e2e4e6}
.sso.a{background:#000;color:#fff;border:0}
.orl{display:flex;align-items:center;gap:10px;font-size:12px;color:#9a9ea3;margin:12px 0}
.orl::before,.orl::after{content:"";flex:1;height:1px;background:#e8e6e2}

/* Carte de membre */
.mcard{position:relative;width:296px;max-width:100%;aspect-ratio:1.586;border-radius:22px;padding:18px 20px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,#2a2f34 0%,#111417 55%,#0a0c0e 100%);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:space-between}
.mcard.in{animation:cardIn .9s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) rotateX(30deg) translateY(28px) scale(.94)}}
.mcard .sheen{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.14) 50%,transparent 58%);animation:sheen 5s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-60%)}55%,100%{transform:translateX(60%)}}
.mcard.elite{background:radial-gradient(120% 140% at 0% 0%,#ff7a3a 0%,#d44000 46%,#6e2100 100%);box-shadow:0 30px 80px rgba(212,64,0,.5),0 0 0 1px rgba(255,255,255,.25),inset 0 1px 0 rgba(255,255,255,.3);transition:background .6s}
.mc-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.mc-logo{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.mc-tier{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.12)}
.mcard.elite .mc-tier{background:#fff;color:#a33100}
.mc-name{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1;min-height:26px;position:relative}
.mc-name .caret{display:inline-block;width:2px;height:22px;background:var(--soft);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mc-meta{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.62);margin-top:6px;letter-spacing:.04em;position:relative}
.mc-meta b{color:#fff;font-weight:700}
.mc-no{display:inline-block;transition:opacity .4s,transform .4s var(--ease)}
.mc-no.off{opacity:0;transform:translateY(4px)}
.stamps{display:flex;gap:7px;position:relative}
.stamp{width:42px;height:42px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:8px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.42);text-align:center;line-height:1.05}
.stamp.on{border:2px solid #fff;color:#fff;background:rgba(255,90,20,.28);box-shadow:0 0 16px rgba(255,90,20,.45)}
.mcard.elite .stamp.on{background:rgba(255,255,255,.18)}
.stamp.hit{animation:stampHit .6s var(--ease)}
@keyframes stampHit{from{transform:scale(1.7) rotate(-16deg);opacity:0}}
.ctoast{position:absolute;left:16px;right:16px;top:58px;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:999px;background:#fff;color:var(--tink);box-shadow:0 12px 30px rgba(0,0,0,.35);animation:toastIn 2.8s var(--ease) forwards;pointer-events:none}
@keyframes toastIn{0%{opacity:0;transform:translateY(-14px) scale(.96)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.ctoast .s{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.ctoast b{font-size:13.5px;display:block}
.ctoast span{font-size:12px;color:var(--tmuted)}

/* Carrousel pré-inscription */
.segbar{display:flex;gap:5px;flex:1}
.segbar button{flex:1;height:16px;padding:6px 0;border:0;background:none;cursor:pointer}
.segbar i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.segbar i b{display:block;height:100%;width:0;background:#fff}
.segbar .done b{width:100%}
.segbar .run b{animation:fill 4.6s linear forwards}
@keyframes fill{to{width:100%}}
.brand{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.vstage{flex:1;min-height:0;display:grid;place-items:center;position:relative;cursor:pointer}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,90,20,.32),transparent);filter:blur(8px);pointer-events:none}
.vcard{width:300px;max-width:100%;background:rgba(20,23,26,.94);border-radius:24px;padding:18px;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);position:relative;animation:pop .6s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.mk{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.clock{position:relative;width:236px;height:236px;animation:pop .6s var(--ease)}
.clock svg{width:100%;height:100%;overflow:visible}
.clock path{fill:none;stroke:rgba(255,255,255,.2);stroke-width:24}
.clock path.s{stroke:#ff5a14;filter:drop-shadow(0 0 10px rgba(255,90,20,.9))}
.clock .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.clock .c b{font-size:64px;font-weight:900;letter-spacing:-.04em;line-height:.9}
.clock .c b small{font-size:22px;color:rgba(255,255,255,.45)}
.clock .c span{font-size:12px;font-weight:700;color:rgba(255,255,255,.62);margin-top:6px;max-width:110px;line-height:1.25}
.chipf{position:absolute;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;background:rgba(22,25,28,.94);box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1);white-space:nowrap;animation:pop .55s var(--ease) both}
.chipf i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.chipf.hot{background:#ff5a14}
.chipf.hot i{background:#fff}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{height:54px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;transition:transform .16s var(--ease),background .15s}
.role:active{transform:scale(.97)}

/* ── Présignup v2 (inspirations Swile + crypto) : l'interface s'efface, la photo et l'objet portent le message ── */
.ps-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.ps-bg img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.62);animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.08) translate(-1.5%,1%)}to{transform:scale(1) translate(0,0)}}
.ps-bg::after{content:"";position:absolute;inset:0;background:#c43a00;mix-blend-mode:multiply;opacity:.78}
.ps-sweep{position:absolute;inset:-30%;z-index:1;pointer-events:none;background:linear-gradient(118deg,transparent 30%,rgba(255,150,70,.32) 44%,rgba(255,200,140,.18) 50%,transparent 62%);animation:sweep 7s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sweep{0%,100%{transform:translateX(-12%)}50%{transform:translateX(12%)}}
.ps-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(7,10,13,.45) 0%,transparent 22%,transparent 46%,rgba(7,10,13,.88) 70%,#070a0d 100%)}
.ps-top{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:58px 20px 0}
.ps-role{flex-shrink:0;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ps-stage{position:relative;z-index:3;flex:1;min-height:0;display:grid;place-items:center}
.ps-tap{position:absolute;inset:0;z-index:4;display:grid;grid-template-columns:1fr 2fr}
.ps-tap button{border:0;background:none;cursor:pointer}
.ps-copy{position:relative;z-index:5;text-align:center;padding:0 26px}
.ps-copy h2{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0;text-wrap:balance}

  if((m=l.match(/^(\d+)x(\d+) (m|min)(.*)$/))&&+m[1]>3)return[`${m[1]-2}×${m[2]} ${m[3]}`,`${m[1]}×${m[2]} ${m[3]}`,(m[4]||"").replace(/^ à /,"").replace(/^,? ?/,"")||"Répétitions"];

/* ── Anneau de décision (DecisionRing fluide, géométrie et couleurs de l'app) ── */
const A0=-120,A1=120;
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
const pt=p=>`${p[0].toFixed(2)} ${p[1].toFixed(2)}`;
const arcP=(cx,cy,r,f,t)=>`M ${pt(polar(cx,cy,r,f))} A ${r} ${r} 0 ${t-f>180?1:0} 1 ${pt(polar(cx,cy,r,t))}`;
function sectorP(cx,cy,ri,ro,a0,a1){const rc=((ro-ri)/2).toFixed(2),big=a1-a0>180?1:0;return `M ${pt(polar(cx,cy,ro,a0))} A ${ro} ${ro} 0 ${big} 1 ${pt(polar(cx,cy,ro,a1))} A ${rc} ${rc} 0 0 1 ${pt(polar(cx,cy,ri,a1))} A ${ri} ${ri} 0 ${big} 0 ${pt(polar(cx,cy,ri,a0))} A ${rc} ${rc} 0 0 1 ${pt(polar(cx,cy,ro,a0))} Z`;}
const angD=v=>A0+((Math.max(1,Math.min(10,v))-1)/9)*(A1-A0);
function decisionRing({value,lo,hi,kicker,title,hint,size=300}){
  const r=Math.round(size*.36),sw=Math.round(size*.055),ro=r+sw*.95,ri=r-sw*.95,cx=size/2,cy=Math.round(ro+sw/2+3),h=Math.round(cy+ro*.5+sw/2+3);
  const end=angD(value),N=40;let fills="";

  const [sx,sy]=polar(cx,cy,r,A0),[ex,ey]=polar(cx,cy,r,end),za0=angD(lo-.35),za1=angD(hi+.35),mid=(za0+za1)/2;
  const [ax,ay]=polar(cx,cy,r-sw*.8,end),[bx,by]=polar(cx,cy,r+sw*.8,end),[lx,ly]=polar(cx,cy,r+sw*.8+11,end);
  const glow=braiseColor(value,lo,hi), zid="zl"+Math.round(Math.random()*1e6);

    <div class="halo" style="left:50%;top:${cy}px;width:${size*1.1}px;height:${size*1.1}px;background:radial-gradient(circle,${glow}55 0%,${glow}1f 42%,transparent 68%)"></div>
    <svg width="${size}" height="${h}" viewBox="0 0 ${size} ${h}" role="img" aria-label="Prévue ${diffWord(value).toLowerCase()}, au-dessus de la zone du jour" style="position:relative;overflow:visible">
      <path d="${arcP(cx,cy,r,A0,A1)}" fill="none" stroke="#1d2226" stroke-width="${sw}" stroke-linecap="round"/>${fills}
      <circle cx="${sx}" cy="${sy}" r="${sw/2}" fill="${braiseColor(1,lo,hi)}"/><circle cx="${ex}" cy="${ey}" r="${sw/2}" fill="${glow}"/>
      <path id="${zid}" d="${arcP(cx,cy,ro+9,mid-70,mid+70)}" fill="none"/>
      <text font-family="IBM Plex Mono" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="rgba(255,255,255,.8)"><textPath href="#${zid}" startOffset="50%" text-anchor="middle">OPTIMAL</textPath></text>
      <path d="${sectorP(cx,cy,ri,ro,za0,za1)}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="${lx}" y="${ly+3}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" font-weight="700" letter-spacing=".5" fill="rgba(255,255,255,.7)">PRÉVU</text>
      <g transform="translate(${ex} ${ey}) scale(${Math.max(1,sw/16).toFixed(2)})"><circle r="12.5" fill="rgba(255,255,255,.14)"/><circle r="9.5" fill="#18181b" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>${[-3,0,3].map(dy=>`<line x1="-3.5" x2="3.5" y1="${dy}" y2="${dy}" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`).join("")}</g>
    </svg>${swarmCanvas({k:"d",v:value,lo,hi,r,sw,cx,cy,size,h})}
    <div class="ringcenter fadein" style="top:${cy-Math.round(r*.12)}px">${kicker?`<span class="rk">${kicker}</span>`:""}<span class="rt" style="font-size:${Math.round(size*.1)}px">${title}</span></div>
  </div>${hint?`<div class="rhint fadein">${hint}</div>`:""}`;
}
function miniRing(value,lo,hi,size=40){
  const r=size*.36,sw=Math.max(3,Math.round(size*.17)),ro=r+sw*.75,ri=r-sw*.75,cx=size/2,cy=ro+2,h=Math.round(cy+ro*.5+2),end=angD(value);let f="";

/* ── Essaims (portage de useDecisionSwarm / useSwarm de l'app) ── */
const TAU=2*Math.PI,ARC_FROM=((A0-90)*Math.PI)/180,ARC_TO=((A1-90)*Math.PI)/180,SWST=new WeakMap();let swRaf=0;
function swarmCanvas(o){const m=Math.round(o.size*.12);return `<canvas class="swarm" aria-hidden="true" data-o='${JSON.stringify(o)}' style="position:absolute;left:${-m}px;top:${-m}px;width:${o.size+2*m}px;height:${o.h+2*m}px;pointer-events:none;z-index:1"></canvas>`;}
function swarmFrame(cv,now,dt){let st=SWST.get(cv);const L=JSON.parse(cv.dataset.o);
  if(!st){const N=L.k==="d"?40:72;st={born:now,sg:0,boost:1,T:0,s:0,P:Array.from({length:N},(_,i)=>({phi:L.k==="d"?(i/N)*TAU:((i*.6180339)%1)*TAU,ang:L.k==="d"?(i/N)*TAU:((i*.6180339)%1)*TAU+(Math.random()-.5),r:0,sd:Math.random(),cl:Math.floor(Math.random()*7),ty:i&1,al:0}))};SWST.set(cv,st);}
  const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,hh=cv.clientHeight,g=cv.getContext("2d");if(!w||!g)return;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(hh*dpr);}
  const m=L.size*.12,t=reduced?0:now/1000;g.setTransform(dpr,0,0,dpr,dpr*m,dpr*m);g.clearRect(-m,-m,w,hh);
  const scale=L.size/300,br=Math.sin(t*TAU/10),Rorb=L.r+L.sw*1.15,arrive=reduced?1:Math.min(1,(now-st.born)/1100);
  if(L.k==="d"){const lo=L.lo-.3,hi=L.hi+.3,dist=L.v<lo?lo-L.v:L.v>hi?L.v-hi:0,target=L.v>hi?Math.min(1,dist/3):L.v<lo?-Math.min(1,dist/3):0;
    st.sg+=(target-st.sg)*Math.min(1,dt*2.2);const awake=now-st.born<1800;st.boost+=((awake?1:0)-st.boost)*Math.min(1,dt*3);
    const sv=st.sg*(.3+.7*st.boost),hot=Math.max(0,sv),cold=Math.max(0,-sv),calm=1-hot-cold,agit=hot+cold,N=st.P.length,nT=Math.ceil(N/2);
    st.T+=dt*.12*(1-.9*cold)*(1+1.5*hot);
    if(calm>.05){g.beginPath();g.arc(L.cx,L.cy,Rorb+calm*br*2*scale,ARC_FROM,ARC_TO);g.strokeStyle=`rgba(255,255,255,${(calm*(.1+.06*br)*.6).toFixed(3)})`;g.lineWidth=1;g.stroke();}
    st.P.forEach((q,i)=>{if(!q.r)q.r=reduced?Rorb:Rorb+(60+80*q.sd)*scale;
      q.ang+=dt*hot*(q.sd-.5)*5+hot*.05*Math.sin(t*(6+5*q.sd)+9*q.sd);
      const clA=(q.cl/7)*TAU+st.T+(q.sd-.5)*.18,home=q.phi+st.T,toCl=Math.atan2(Math.sin(clA-home),Math.cos(clA-home))*Math.min(1,cold*1.3);let tg=home+toCl;
      const k=Math.floor(i/2),segA=(q.ty?0:Math.PI)+((k+.5)/nT)*Math.PI+st.T*.3,dS=Math.atan2(Math.sin(segA-tg),Math.cos(segA-tg));tg+=dS*Math.min(1,agit*1.4);
      const tr=Rorb+(hot*26*Math.sin(t*(3+5*q.sd)+10*q.sd)+cold*(2+6*q.sd)+calm*br*2)*scale,dA=Math.atan2(Math.sin(tg-q.ang),Math.cos(tg-q.ang));
      q.ang+=dA*Math.min(1,dt*(2.5*(1-hot)+.3));q.r+=(tr-q.r)*Math.min(1,dt*(arrive<1?2.5:4+hot*6));
      const u=(((q.ang%TAU)+TAU)%TAU)/TAU,da=ARC_FROM+u*(ARC_TO-ARC_FROM),edge=Math.min(1,u/.06,(1-u)/.06),x=L.cx+q.r*Math.cos(da),y=L.cy+q.r*Math.sin(da);
      const dom=q.ty?hot-cold:cold-hot,sz=(1.4+hot*q.sd*1.2+cold*1.1)*(1+.7*Math.max(0,dom)-.4*Math.max(0,-dom))*scale*1.3;
      const al=Math.min(1,(.5+.35*q.sd*hot+.35*cold+(.25*calm*(br+1))/2)*.6+.2)*edge*Math.min(1,arrive*1.4);
      if(hot>.3&&q.ty){g.beginPath();g.arc(x,y,sz*2.6,0,TAU);g.fillStyle=`rgba(255,120,40,${(.18*hot).toFixed(3)})`;g.fill();}
      g.beginPath();g.arc(x,y,sz,0,TAU);g.fillStyle=q.ty?`rgba(246,128,64,${al.toFixed(2)})`:`rgba(128,184,204,${al.toFixed(2)})`;g.fill();});
  }else{const sc=L.v<0?null:L.v;st.s+=(Math.max(0,Math.min(1,(sc??0)/100))-st.s)*Math.min(1,dt*2);const s2=st.s,N=st.P.length,vis=sc==null?0:Math.round(N*(.18+.82*s2));st.T+=dt*(.02+.16*s2);
    if(s2>.05){g.beginPath();g.arc(L.cx,L.cy,Rorb+br*2*s2,ARC_FROM,ARC_TO);g.strokeStyle=`rgba(255,255,255,${((.04+.08*s2)*(.7+(.3*(br+1))/2)).toFixed(3)})`;g.lineWidth=1;g.stroke();}
    st.P.forEach((q,i)=>{if(!q.r)q.r=Rorb+60+Math.random()*80;q.al+=((i<vis?1:0)-q.al)*Math.min(1,dt*2.5);if(q.al<.02)return;
      const home=q.phi+st.T,dA=Math.atan2(Math.sin(home-q.ang),Math.cos(home-q.ang));q.ang+=dA*Math.min(1,dt*1.5);
      const tr=Rorb+s2*5*Math.sin(t*(1+2*q.sd)+10*q.sd)+br*2*s2+(1-s2)*6*q.sd;q.r+=(tr-q.r)*Math.min(1,dt*2.5);
      const u=(((q.ang%TAU)+TAU)%TAU)/TAU,da=ARC_FROM+u*(ARC_TO-ARC_FROM),edge=Math.min(1,u/.06,(1-u)/.06);if(edge<.02)return;
      const sag=(1-s2)*(6+16*q.sd),x=L.cx+q.r*Math.cos(da),y=L.cy+q.r*Math.sin(da)+sag,rad=(1.1+.9*s2+.6*q.sd*s2)*1.3;
      if(s2>.7){g.beginPath();g.arc(x,y,rad*2.6,0,TAU);g.fillStyle=`rgba(140,195,212,${(.22*(s2-.7)/.3).toFixed(3)})`;g.fill();}
      g.beginPath();g.arc(x,y,rad,0,TAU);g.fillStyle=`rgba(140,195,212,${((.22+.6*s2)*q.al*edge*(.8+(.2*s2*(br+1))/2)).toFixed(2)})`;g.fill();});}
}
function swarmLoop(){let last=performance.now();const f=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden)document.querySelectorAll("canvas.swarm").forEach(cv=>swarmFrame(cv,now,dt));swRaf=requestAnimationFrame(f);};swRaf=requestAnimationFrame(f);}

  radar:()=>{const s=session(),d=s.d,P=[["LB","Léa",62,d],["TM","Thomas",22,d],["HR","Hugo",86,d],["IS","Inès",34,d]];

        <polygon points="${hiL} ${loL}" fill="rgba(255,255,255,.08)"/>

        <text x="${xs(50)}" y="${ys(4.6)}" text-anchor="middle" transform="rotate(-34 ${xs(50)} ${ys(4.6)})" font-family="IBM Plex Mono" font-size="9" letter-spacing=".8" fill="rgba(232,238,243,.65)">MAINTENIR</text>

        ${[[0,42,"#e07b4a","FATIGUÉ"],[42,58,"#c9b45a","ÉQUILIBRÉ"],[58,100,"#5fae7e","FRAIS"]].map(([f,to,c,l])=>`<rect x="${xs(f)}" y="${ys(0)-1.5}" width="${xs(to)-xs(f)}" height="3" fill="${c}"/><text x="${(xs(f)+xs(to))/2}" y="${H-5}" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" letter-spacing=".6" fill="${c}">${l}</text>`).join("")}
        ${[[0,4.5,"#2f9e44","FACILE"],[4.5,7.5,"#f28a00","MODÉRÉE"],[7.5,10,"#d44000","DURE"]].map(([lo,hi,c,l])=>`<rect x="${xs(0)-1.5}" y="${ys(hi)}" width="3" height="${ys(lo)-ys(hi)}" fill="${c}"/><text x="8" y="${(ys(lo)+ys(hi))/2}" text-anchor="middle" transform="rotate(-90 8 ${(ys(lo)+ys(hi))/2})" font-family="IBM Plex Mono" font-size="7.5" letter-spacing=".5" fill="${c}">${l}</text>`).join("")}
      </svg>${P.map(dot).join("")}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45)">Sans point forme <span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:10px">MC</span></div>

/* ── Séance en direct (liveSets : ressenti 5 niveaux, +2,5 % / −5 % par cran, allure −5 s / +10 s) ── */
const FEEL=[["tfacile","Beaucoup plus facile"],["facile","Plus facile"],["prevu","Comme prévu"],["dur","Plus dur"],["tdur","Beaucoup plus dur"]];
const FEEL_SYM={tfacile:"++",facile:"+",prevu:"=",dur:"−",tdur:"−−"},STEP_OF={tfacile:2,facile:1,prevu:0,dur:-1,tdur:-2};
function initLive(){const s=session(),dir=dayDir(s.d),re=/^(.+?) (\d+)x(\d+) @ (\d+)\s?%$/,f=s.l.find(l=>re.test(l)),tag=dir==="low"?"allégé "+when():dir==="high"?"poussé "+when():"tel que prévu";
  if(S.sport==="muscu"&&f){const m=f.match(re),base=+m[4]+(dir==="low"?-7:dir==="high"?3:0),n=dir==="low"?Math.max(2,+m[2]-1):+m[2];S.live={kind:"pct",name:m[1],reps:+m[3],meta:`${n} séries · ${m[3]} reps · ${base} % (${tag})`,sets:Array.from({length:n},()=>({v:base,done:null,adj:false}))};}
  else if(S.sport==="muscu"){const g=s.l.map(l=>l.match(/^(.+?) (\d+)x(\d+)/)).find(Boolean)||["","Squat","3","10"];S.live={kind:"reps",name:g[1],reps:+g[3],meta:`${g[2]} séries · ${g[3]} reps (${tag})`,sets:Array.from({length:Math.max(2,+g[2])},()=>({v:+g[3],done:null,adj:false}))};}
  else{const seuil=/seuil/i.test(s.n),vma=/VMA/i.test(s.n),base=(vma?250:seuil?275:330)+(dir==="low"?10:dir==="high"?-5:0),n=vma?4:seuil?(dir==="low"?2:3):3;
    S.live={kind:"pace",name:vma?"400 m à VMA":seuil?"Seuil 10 min":"Bloc de 10 min",meta:`${n} répétitions · ${Math.floor(base/60)}:${String(base%60).padStart(2,"0")}/km (${tag})`,sets:Array.from({length:n},()=>({v:base,done:null,adj:false}))};}
  S.liveIdx=0;S.toast=null;}
const fmtSet=v=>S.live.kind==="pace"?`${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}`:S.live.kind==="reps"?`${Math.max(1,Math.round(v))} reps`:`${String(Math.round(v*10)/10).replace(".",",")} %`;
function tapFeel(i,btn){const L=S.live;if(S.liveIdx>=L.sets.length)return;const f=FEEL[i][0],step=STEP_OF[f];L.sets[S.liveIdx].done=f;const nx=S.liveIdx+1;let tail="",badge=null;
  if(nx<L.sets.length&&step!==0){for(let k=nx;k<L.sets.length;k++){if(L.kind==="pace")L.sets[k].v+=step>0?-5*step:10*-step;else if(L.kind==="reps")L.sets[k].v=Math.max(1,L.sets[k].v+step);else L.sets[k].v=Math.round(L.sets[k].v*(1+(step>0?.025*step:.05*step))*10)/10;L.sets[k].adj=true;}
    badge=(L.kind==="pace"?(step>0?`−${5*step} s`:`+${10*-step} s`):L.kind==="reps"?(step>0?`+${step} rep`:`${step} rep`):(step>0?`+${2.5*step} %`:`−${5*-step} %`)).replace(".",",");tail=` · S${nx+1} ${badge}`;}
  S.toast=`Série ${nx} faite · ${FEEL[i][1]}${tail}`;S.liveIdx=nx;
  const from=btn.getBoundingClientRect();
  render(true);
  document.querySelectorAll(".feelbar button").forEach((b,k)=>{if(k<=i){const c=chargeColor(.15+.85*k/4);b.style.background=c;b.style.borderColor=c;} if(k===i)b.style.boxShadow="0 0 0 2px #fff";});
  if(badge)fly(badge,from,nx);}
function fly(text,from,idx){const cell=document.querySelectorAll(".cell")[idx];if(!cell)return;if(reduced){cell.classList.add("flash");return;}
  const ph=$("phone").getBoundingClientRect(),to=cell.getBoundingClientRect(),x0=from.left-ph.left+from.width/2-24,y0=from.top-ph.top;
  const el=document.createElement("div");el.className="fly";el.textContent=text;el.style.left=x0+"px";el.style.top=y0+"px";$("phone").appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform=`translate(${(to.left-ph.left)-x0}px,${(to.top-ph.top-8)-y0}px) scale(.9)`;el.style.opacity="0";}));
  setTimeout(()=>{cell.classList.add("flash");el.remove();},700);}

  <label class="field">Numéro de carte<input inputmode="numeric" placeholder="1234 1234 1234 1234" autocomplete="off"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="field">Expiration<input placeholder="MM / AA" autocomplete="off"></label><label class="field">Code<input placeholder="CVC" autocomplete="off"></label></div>
  <button type="button" class="pill" data-elite style="margin-top:4px">Activer mes 14 jours</button></div><div class="caption lt">✓ Annulation en 1 clic, sans engagement.</div></div></div>`;}

function sysHtml(){const ios=S.plat==="ios",k=S.sys;
  if(k==="health")return `<div class="health ${ios?"":"and"}"><div class="hh"><span>Ne pas autoriser</span><b data-sysok style="cursor:pointer">Autoriser</b></div><div class="ht"><div class="ic">${ios?"♥":"✚"}</div><b>${ios?"Santé":"Santé Connect"}</b><p>ThePerfClub souhaite accéder à tes données ${ios?"Santé":"de santé"} et les mettre à jour.</p></div>
    <div class="lbl">Autoriser ThePerfClub à lire</div><div class="grp">${["Sommeil","Fréquence cardiaque au repos","Variabilité de la fréquence cardiaque","Entraînements","Pas"].map(x=>`<div class="row">${x}<span class="sw"></span></div>`).join("")}</div>
    <button type="button" data-sysok style="margin:18px 16px;height:50px;border-radius:12px;border:0;background:${ios?"#007aff":"#6750a4"};color:#fff;font-size:17px;font-weight:600;cursor:pointer">Autoriser</button></div>`;
  if(k==="notif"&&S.plat==="web")return `<div class="sys" style="place-items:start center;padding-top:70px"><div style="width:300px;border-radius:12px;background:#fff;color:#1f1f1f;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-family:system-ui,sans-serif;animation:pop .25s var(--ease)"><div style="font-size:14px">go.theperfclub.com veut</div><div style="display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px">🔔 Afficher des notifications</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button type="button" data-sysok style="border:1px solid #c4c7c5;background:#fff;border-radius:20px;padding:7px 14px;color:#0b57d0;font-weight:600;cursor:pointer">Bloquer</button><button type="button" data-sysok style="border:0;background:#0b57d0;color:#fff;border-radius:20px;padding:7px 14px;font-weight:600;cursor:pointer">Autoriser</button></div></div></div>`;
  if(k==="notif")return `<div class="sys">${ios?`<div class="ios-alert"><div class="b"><b>« ThePerfClub » souhaite vous envoyer des notifications</b><p>Les notifications peuvent inclure des alertes, des sons et des pastilles d'icônes.</p></div><div class="btns"><button type="button" data-sysok>Refuser</button><button type="button" data-sysok>Autoriser</button></div></div>`
    :`<div class="and-dlg"><b>Autoriser ThePerfClub à vous envoyer des notifications ?</b><div class="btns"><button type="button" data-sysok>Ne pas autoriser</button><button type="button" data-sysok>Autoriser</button></div></div>`}</div>`;
  if(k==="rate")return `<div class="sys">${ios?`<div class="ios-alert"><div class="b"><b>Vous aimez ThePerfClub ?</b><p>Touchez une étoile pour l'évaluer sur l'App Store.</p></div><div class="stars5">☆☆☆☆☆</div><div class="btns one"><button type="button" data-sysok>Plus tard</button></div></div>`
    :`<div class="and-dlg"><b>Évaluer ThePerfClub</b><p>Votre avis est public et inclut le nom de votre compte.</p><div style="font-size:30px;color:#6750a4;margin-top:12px;letter-spacing:6px">☆☆☆☆☆</div><div class="btns"><button type="button" data-sysok>Plus tard</button><button type="button" data-sysok>Envoyer</button></div></div>`}</div>`;
  return "";}

function tplSheetHtml(){const L=S.tpls.list;return `<div class="overlay" data-closetpl><div class="sheet"><div class="grab"></div><div class="st">Changer de séance</div><div class="ss">${S.fromProg?"Ou garde celle de ton programme.":"Séances types de "+(S.sport==="muscu"?"musculation":"course")+", toutes modifiables."}</div>
  ${L.map((x,i)=>`<button type="button" class="optc" data-picktpl="${i}" aria-pressed="${S.tpl===i}" style="justify-content:space-between"><span>${esc(x.n)}<small style="display:block;font-size:12.5px;font-weight:600;color:#6b7177;margin-top:2px">${esc(x.l.slice(0,2).join(" · "))}</small></span><span style="font-size:12px;font-weight:800;color:${chargeColor(.25+.75*x.d/10)}">${diffWord(x.d)}</span></button>`).join("")}
  ${S.fromProg?"":`<div class="lab" style="margin-top:16px">J'écris la mienne</div><textarea id="wt" style="width:100%;min-height:96px;margin-top:8px;border:1px solid #e2e4e6;border-radius:14px;background:#f7f8f9;padding:12px;font-size:15px;line-height:1.5;color:#171b1f;resize:none" placeholder="${S.sport==="muscu"?"Squat 4x5 @ 80%&#10;Développé couché 4x6":"Échauffement 20 min&#10;3x10 min au seuil"}">${esc(S.writeText)}</textarea><button type="button" class="pill" style="margin-top:10px" data-picktpl="${L.length}">Prendre ma séance</button>`}</div></div>`;}
function appSheetHtml(){return `<div class="overlay"><div class="sheet"><div class="grab"></div><div class="st">Ta prochaine séance t'attend sur l'app</div><div class="ss">Rappels de point forme, séance en direct au poignet, tout est synchronisé.</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button type="button" class="sso a" data-next>App Store</button><button type="button" class="sso a" data-next>Google Play</button></div><button type="button" class="ghost" data-next>Continuer ici</button></div></div>`;}
/* Après le déclic : note native (mobile) ou feuille « l'app » (web), par-dessus l'écran. */
function afterAha(){if(S.plat==="web"){S.appSheet=true;render(true);}else{S.sys="rate";render(true);}}

/* ── Rendu ── */
function renderSteps(){let ph="",h="";steps().forEach((s,i)=>{if(s[1]!==ph){ph=s[1];h+=`<li class="ph-h">${esc(ph)}</li>`;}h+=`<li><button type="button" data-go="${i}" ${i===S.step?'aria-current="step"':''}><span class="n">${String(i+1).padStart(2,"0")}</span><span><span class="t">${esc(s[2])}</span><span class="tag ${s[4]}">${s[4]==="new"?"nouveau":s[4]==="todo"?"à construire":"existe en prod"}</span>${s[3]?`<div class="d">${esc(s[3])}</div>`:""}</span></button></li>`;});$("steps").innerHTML=h;}
function render(quiet){
  renderSteps();clearInterval(slideTimer);clearTimeout(readTimer);
  const ph=$("phone");ph.classList.toggle("quiet",!!quiet);
  const st=quiet?($("screen").querySelector(".body")?.scrollTop||0):0, carX=quiet?($("car")?.scrollLeft??null):null;
  $("screen").innerHTML=`<div class="scr ${S.dir<0?"back":""}">${SCR[cur()]()}</div>${S.sheet?exitSheet():""}${S.paySheet?paySheetHtml():""}${S.video?videoHtml():""}${S.sys?sysHtml():""}`;
  if(quiet){const b=$("screen").querySelector(".body");if(b)b.scrollTop=st;}
  const pc=$("pcar");if(pc){pc.scrollLeft=pc.clientWidth*S.pslide;pc.onscroll=()=>{const k=Math.round(pc.scrollLeft/Math.max(1,pc.clientWidth));if(k!==S.pslide){S.pslide=k;document.querySelectorAll(".pdots i").forEach((d,i)=>d.classList.toggle("on",i===k));}};}
  const car=$("car");if(car){ if(carX!=null)car.scrollLeft=carX; else{const t=car.children[S.tpl];if(t)car.scrollLeft=t.offsetLeft-car.offsetLeft-(car.clientWidth-t.clientWidth)/2;}
    car.onscroll=()=>{const mid=car.scrollLeft+car.clientWidth/2;let best=0,bd=1e9;[...car.children].forEach((c,i)=>{const d=Math.abs(c.offsetLeft-car.offsetLeft+c.clientWidth/2-mid);if(d<bd){bd=d;best=i;}});if(best!==S.tpl){S.tpl=best;S.live=null;[...car.children].forEach((c,i)=>c.classList.toggle("dim",i!==best));document.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===best));const rs=$("ringslot");if(rs)rs.innerHTML=sessRing();}};}
  const seg=$("segs10");if(seg){const pick=e=>{const r=seg.getBoundingClientRect();return Math.max(1,Math.min(10,Math.floor((e.clientX-r.left)/r.width*10)+1));};let drag=false;
    seg.onpointerdown=e=>{drag=true;try{seg.setPointerCapture(e.pointerId);}catch(_){}S.ans[seg.dataset.key]=pick(e);render(true);rebindSeg(e.pointerId);};
  }
  if(cur()==="pre"&&!reduced)slideTimer=setInterval(()=>{S.slide=(S.slide+1)%SLIDES[S.role].length;render(true);const c=document.querySelector(".ps-copy");},4600);
  if(cur()==="read"){const lis=[...document.querySelectorAll("#rl li")];lis.forEach((l,i)=>setTimeout(()=>l.classList.add("on"),reduced?0:250+i*350));readTimer=setTimeout(()=>{if(cur()==="read")go(S.step+1);},reduced?500:1900);}
  if(S.stampToast)setTimeout(()=>{S.stampToast=null;},2900);
  if(S.video)playVideo();
  if(!quiet&&!reduced)document.querySelectorAll("[data-count]").forEach(el=>{const N=+el.dataset.count,t0=performance.now();const tick=t=>{const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=Math.round(N*e);if(k<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);});
}
/* Après un rendu, la barre est recréée : on garde le geste (glisser) sur la nouvelle, puis on avance au lâcher. */
function rebindSeg(pid){const seg=$("segs10");if(!seg)return;try{seg.setPointerCapture(pid);}catch(_){}
  const pick=e=>{const r=seg.getBoundingClientRect();return Math.max(1,Math.min(10,Math.floor((e.clientX-r.left)/r.width*10)+1));};
  seg.onpointermove=e=>{const v=pick(e);if(v!==S.ans[seg.dataset.key]){S.ans[seg.dataset.key]=v;render(true);rebindSeg(e.pointerId);}};
  const end=()=>{seg.onpointermove=null;setTimeout(()=>{if(cur()==="pf"){S.q=Math.min(S.q+1,PFQ.length);render(true);}},420);};
  seg.onpointerup=end;seg.onpointercancel=()=>{seg.onpointermove=null;};}
function onEnter(){if(cur()==="fact"){S.anl=true;clearTimeout(window._anl);window._anl=setTimeout(()=>{S.anl=false;if(cur()==="fact")render();},2600);}const L=steps(),ipf=L.findIndex(s=>s[0]==="pf"); if(cur()==="pf")S.q=Math.min(S.q,PFQ.length);}
function go(n,dir=1){S.dir=dir;S.step=Math.max(0,Math.min(steps().length-1,n));S.sheet=false;S.video=false;S.appSheet=false;S.tplSheet=false;S.sys=null;S.pslide=0;S.react=null;if(cur()==="sess"){S.sessMode="plan";if(!coach()&&!S.fromProg){initTpls();const k=S.tpls.list.findIndex(t=>dayDir(t.d)!=="flat");S.tpl=k<0?0:k;S.live=null;}}onEnter();render();}
function setSeg(a,v){document.querySelectorAll(`[${a}]`).forEach(b=>b.setAttribute("aria-pressed",b.getAttribute(a)===v));}
function fill(){if(S.step>steps().findIndex(s=>s[0]==="sport"))S.sportChosen=true;if(!S.auth)S.auth="sso";if(!S.goal)S.goal=goalList()[1][0];if(!S.when)S.when=8;if(!S.pi)S.pi="hard";if(!S.freq)S.freq=3;if(S.hab.freq==null)S.hab.freq=1;if(S.hab.stag==null)S.hab.stag=2;if(!habDone())S.ans={sleep:4,stress:7,recovery:4,motivation:null};S.q=PFQ.length;if(!S.beh.length&&!S.behNone)S.beh=["late_sleep","screen_late"];if(coach()&&!S.count)S.count="10";}
function updSignup(){const g=$("go");if(g)g.disabled=!(S.first.trim().length>1&&EMAIL.test(S.email));const nm=document.querySelector(".mc-name");if(nm)nm.innerHTML=(esc(S.first)||`<span style="color:rgba(255,255,255,.3)">Ton prénom</span>`)+`<span class="caret"></span>`;const no=document.querySelector(".mc-no");if(no)no.classList.toggle("off",!EMAIL.test(S.email));}

document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(t.id==="f-first"){S.first=t.value;t.classList.toggle("ok",S.first.trim().length>1);updSignup();}
  if(t.id==="f-mail"){S.email=t.value;t.classList.toggle("ok",EMAIL.test(S.email));updSignup();}
  if(d.line){const[i,j]=d.line.split(":").map(Number);S.tpls.list[i].l[j]=t.value;S.live=null;}
  if(t.id==="wt"){S.writeText=t.value;S.live=null;}});
document.addEventListener("change",e=>{if(e.target.id==="rem"){S.remind=+e.target.value;render(true);}if(e.target.dataset.line&&cur()==="sess"){render(true);}});
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-nextslide],[data-closepay],[data-closetpl]");if(!t)return;const d=t.dataset;
  if(d.role){S.role=d.role;S.picked=false;S.pi=null;S.hab={freq:null,stag:null,sleep:null,stress:null,sore:null};S.hq=0;S.today=null;setSeg("data-role",S.role);S.step=0;S.slide=0;S.live=null;S.stamps={pf:false,dir:false,bilan:false};S.elite=false;S.sentMsg=false;render();return;}
  if(d.sp){S.sport=d.sp;setSeg("data-sp",S.sport);S.live=null;render(true);return;}
  if(d.src){S.fromProg=d.src==="prog";setSeg("data-src",d.src);S.live=null;render(true);return;}
  if(d.go!=null){const n=+d.go;S.sportChosen=n>steps().findIndex(s=>s[0]==="sport");if(n>=3)fill();if(steps()[n][0]==="pf"){S.ans={sleep:null,stress:null,recovery:null,motivation:null};S.q=0;S.beh=[];S.behNone=false;}if(steps()[n][0]==="goal")S.goal=null;if(steps()[n][0]==="freq")S.hab.freq=null;if(steps()[n][0]==="stag")S.hab.stag=null;const L2=steps(),iPf=L2.findIndex(s=>s[0]===(coach()?"sess":"pf")),iDir=L2.findIndex(s=>s[0]===(coach()?"dir":"sess"));S.stamps.pf=n>iPf;S.stamps.dir=n>iDir;S.elite=false;go(n,n>=S.step?1:-1);return;}
  if(d.back!=null){if(cur()==="habits"&&S.hq>0){S.hq--;render(true);return;}if(cur()==="pf"&&S.q>0){S.q--;render(true);return;}if(cur()==="pf"&&S.pi&&!S.fromProg&&!coach()){S.pi=null;render(true);return;}go(S.step-1,-1);return;}
  if(d.slide){S.slide=+d.slide;render(true);return;}
  if(d.nextslide!=null){S.slide=(S.slide+1)%SLIDES[S.role].length;render(true);return;}
  if(d.prevslide!=null){S.slide=(S.slide+SLIDES[S.role].length-1)%SLIDES[S.role].length;render(true);return;}
  if(d.pick){S.role=d.pick;S.picked=true;setSeg("data-role",S.role);render(true);return;}
  if(d.repick!=null){S.picked=false;render(true);return;}
  if(d.mail!=null){S.auth="mail";go(1);setTimeout(()=>$("f-first")?.focus(),80);return;}
  if(d.plat){S.plat=d.plat;setSeg("data-plat",S.plat);S.step=Math.min(S.step,steps().length-1);render(true);return;}
  if(d.askhealth!=null){S.sys="health";render(true);return;}
  if(d.asknotif!=null){S.sys="notif";render(true);return;}
  if(d.askrate!=null){S.sys="rate";render(true);return;}
  if(d.hour){S.hour=d.hour;render(true);return;}
  if(d.sysok!=null){S.sys=null;go(S.step+1);return;}
  if(d.sso!=null){if(!S.first)S.first=coach()?"Karim":"Théo";S.auth="sso";go(1);return;}
  if(d.sport){S.sportChosen=true;if(d.sport!=="x"){S.sport=d.sport;setSeg("data-sp",S.sport);}t.setAttribute("aria-pressed","true");const lab=t.textContent.replace("…","");S.react=coach()?"Leur forme varie d'un jour à l'autre. Tes séances, elles, sont écrites d'avance.":REACT.sport[d.sport]||`${lab}. Ta performance s'y joue aussi hors séance : tes nuits, ton stress, tes journées.`;render(true);setTimeout(()=>go(S.step+1),2300);return;}
  if(d.goal){S.goal=d.goal;S.react=coach()?null:REACT.goal[d.goal]||null;render(true);setTimeout(()=>go(S.step+1),S.react?2300:220);return;}
  if(d.pact!=null){S.pacted=true;render(true);setTimeout(()=>go(S.step+1),900);return;}
  if(d.moreplans!=null){S.morePlans=true;render(true);return;}
  if(d.remind){S.remind=+d.remind;render(true);return;}
  if(d.gq){const[k,i]=d.gq.split(":");S.hab[k]=+i;S.react=REACT[k][+i];render(true);setTimeout(()=>go(S.step+1),2300);return;}
  if(d.today!=null){S.today=+d.today;t.setAttribute("aria-pressed","true");setTimeout(()=>render(),200);return;}
  if(d.hab!=null){const k=HQ[S.hq][0];S.hab[k]=+d.hab;t.setAttribute("aria-pressed","true");render(true);setTimeout(()=>{if(cur()!=="habits")return;if(S.hq<HQ.length-1){S.hq++;render(true);}else go(S.step+1);},420);return;}
  if(d.freq){S.freq=+d.freq;t.setAttribute("aria-pressed","true");setTimeout(()=>go(S.step+1),180);return;}
  if(d.when){S.when=+d.when;render(true);goalDone()&&setTimeout(()=>go(S.step+1),220);return;}
  if(d.paysheet!=null){S.paySheet=true;render(true);return;}
  if(d.closepay!=null&&e.target===t){S.paySheet=false;render(true);return;}
  if(d.closepaybtn!=null){S.paySheet=false;render(true);return;}
  if(d.count){S.count=d.count;t.setAttribute("aria-pressed","true");setTimeout(()=>go(S.step+1),180);return;}
  if(d.plan){S.pi=d.plan;initTpls();S.tpl=S.fromProg?0:piIdx();S.live=null;S.q=0;render();return;}
  if(d.demo!=null){S.ans={sleep:4,stress:7,recovery:4,motivation:null};S.q=PFQ.length;render(true);return;}
  if(d.beh!=null){const k=d.beh;S.behNone=false;S.beh=S.beh.includes(k)?S.beh.filter(x=>x!==k):[...S.beh,k];render(true);return;}
  if(d.behnone!=null){S.behNone=!S.behNone;if(S.behNone)S.beh=[];render(true);return;}
  if(d.behnext!=null){if(S.beh.length||S.behNone)go(S.step+1);return;}
  if(d.del){const[i,j]=d.del.split(":").map(Number);S.tpls.list[i].l.splice(j,1);S.live=null;render(true);return;}
  if(d.add){const i=+d.add;S.tpls.list[i].l.push("");S.live=null;render(true);const ins=document.querySelectorAll(`[data-line^="${i}:"]`);ins[ins.length-1]?.focus();return;}
  if(d.feel!=null){tapFeel(+d.feel,t);return;}
  if(d.launch!=null){afterAha();return;}
  if(d.afterlive!=null){afterAha();return;}
  if(d.tplsheet!=null){S.tplSheet=true;render(true);return;}
  if(d.closetpl!=null&&e.target===t){S.tplSheet=false;render(true);return;}
  if(d.picktpl!=null){S.tpl=+d.picktpl;S.live=null;S.tplSheet=false;render(true);return;}
  if(d.video!=null){S.video=true;render(true);return;}
  if(d.closevideo!=null){S.video=false;clearInterval(vidTimer);render(true);return;}
  if(d.planp){S.plan=d.planp;render(true);return;}
  if(d.elite!=null){S.elite=true;S.paySheet=false;render(true);return;}
  if(d.close!=null){S.sheet=true;S.reasons=[];S.sent=false;render(true);return;}
  if(d.reason){S.reasons=S.reasons.includes(d.reason)?S.reasons.filter(x=>x!==d.reason):[...S.reasons,d.reason];S.sent=false;render(true);return;}
  if(d.send!=null){S.sent=true;render(true);return;}
  if(d.monthly!=null){S.plan="monthly";S.sheet=false;go(steps().findIndex(s=>s[0]==="pay"));return;}
  if(d.backoffer!=null){S.sheet=false;render(true);return;}
  if(d.free!=null){S.sheet=false;go(0,-1);return;}
  if(d.next!=null){if(cur()==="dir"&&coach()&&!S.sentMsg){S.sentMsg=true;S.stamps.dir=true;S.stampToast="dir";render(true);setTimeout(afterAha,1400);return;}if(cur()==="signup"&&!S.first)S.first=coach()?"Karim":"Théo";if(cur()==="sess"&&coach()&&!S.stamps.pf){S.stamps.pf=true;S.stampToast="pf";}go(S.step+1);}
});
render();
</script>
